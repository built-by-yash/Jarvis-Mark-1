<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  canvas { display: block; }
  #status {
    position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    font: 500 15px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .04em;
    color: #9fb4c9; user-select: none; pointer-events: none;
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #4aa8ff; box-shadow: 0 0 12px currentColor; color: #4aa8ff; transition: background .4s, color .4s; }
  #hint { position: fixed; top: 16px; right: 18px; font: 12px "Segoe UI", system-ui, sans-serif; color: #4b5a6b; }
</style>
</head>
<body>
<div id="status"><span id="dot"></span><span id="label">Connecting</span></div>
<div id="hint">Keys 1-4 preview the states</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- state presets ----------
const STATES = {
  idle:      { label: "Idle",      amp: 0.05, speed: 0.35, size: 2.0, spin: 0.06, radius: 1.00, color: [0.29, 0.66, 1.00] },
  listening: { label: "Listening", amp: 0.10, speed: 0.90, size: 2.5, spin: 0.14, radius: 1.00, color: [0.30, 1.00, 0.86] },
  thinking:  { label: "Thinking",  amp: 0.07, speed: 2.40, size: 2.3, spin: 1.10, radius: 0.82, color: [0.72, 0.56, 1.00] },
  speaking:  { label: "Speaking",  amp: 0.16, speed: 1.40, size: 2.8, spin: 0.22, radius: 1.00, color: [1.00, 0.74, 0.34] },
};
let target = STATES.idle;
const cur = { amp: 0.05, speed: 0.35, size: 2, spin: 0.06, radius: 1, color: [...STATES.idle.color] };
let level = 0, levelTarget = 0;

function setState(name) {
  if (!STATES[name]) return;
  target = STATES[name];
  document.getElementById("label").textContent = target.label;
  const c = target.color.map(v => Math.round(v * 255)).join(",");
  const dot = document.getElementById("dot");
  dot.style.background = `rgb(${c})`; dot.style.color = `rgb(${c})`;
}

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 50);
camera.position.z = 3.3;

const COUNT = 7000;
const pos = new Float32Array(COUNT * 3);
const seed = new Float32Array(COUNT);
const shell = new Float32Array(COUNT);
const golden = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < COUNT; i++) {
  const y = 1 - (i / (COUNT - 1)) * 2;
  const r = Math.sqrt(1 - y * y);
  const t = golden * i;
  pos.set([Math.cos(t) * r, y, Math.sin(t) * r], i * 3);
  seed[i] = Math.random();
  shell[i] = 0.55 + 0.45 * Math.pow(Math.random(), 0.35);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
geo.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
geo.setAttribute("aShell", new THREE.BufferAttribute(shell, 1));

const mat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: {
    uTime: { value: 0 }, uAmp: { value: 0.05 }, uSpeed: { value: 0.35 }, uSize: { value: 2 },
    uLevel: { value: 0 }, uRadius: { value: 1 }, uPixel: { value: renderer.getPixelRatio() },
    uColor: { value: new THREE.Vector3(...cur.color) },
  },
  vertexShader: `
    uniform float uTime, uAmp, uSpeed, uSize, uLevel, uRadius, uPixel;
    attribute float aSeed; attribute float aShell;
    varying float vA;
    void main() {
      vec3 dir = normalize(position);
      float n = sin(dir.x * 4.0 + uTime * uSpeed + aSeed * 6.28)
              + sin(dir.y * 5.0 - uTime * uSpeed * 1.3)
              + sin(dir.z * 3.0 + uTime * uSpeed * 0.7);
      float jitter = 0.5 + 0.5 * sin(aSeed * 40.0 + uTime * 8.0);
      float r = aShell * uRadius * (1.0 + uAmp * n * 0.5 + uLevel * 0.45 * jitter);
      vec4 mv = modelViewMatrix * vec4(dir * r, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * uPixel * (6.0 / -mv.z);
      vA = 0.5 + 0.5 * sin(aSeed * 20.0 + uTime * uSpeed);
    }`,
  fragmentShader: `
    uniform vec3 uColor; varying float vA;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(uColor, smoothstep(0.5, 0.0, d) * (0.35 + 0.65 * vA));
    }`,
});
const orb = new THREE.Points(geo, mat);
scene.add(orb);

addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

// ---------- animation ----------
const lerp = (a, b, k) => a + (b - a) * k;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const k = 1 - Math.exp(-dt * 4);
  for (const key of ["amp", "speed", "size", "spin", "radius"]) cur[key] = lerp(cur[key], target[key], k);
  for (let i = 0; i < 3; i++) cur.color[i] = lerp(cur.color[i], target.color[i], k);
  level = lerp(level, levelTarget, 1 - Math.exp(-dt * 14));
  levelTarget *= Math.exp(-dt * 3); // decay if updates stop

  const u = mat.uniforms;
  u.uTime.value += dt * (reduced ? 0.3 : 1);
  u.uAmp.value = cur.amp; u.uSpeed.value = cur.speed; u.uSize.value = cur.size;
  u.uRadius.value = cur.radius; u.uLevel.value = level;
  u.uColor.value.set(...cur.color);

  orb.rotation.y += dt * cur.spin * (reduced ? 0.3 : 1);
  orb.rotation.x = Math.sin(u.uTime.value * 0.15) * 0.2;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

// ---------- connection to the assistant ----------
// main.py sets this to true when it loads the page inside its own window.
const EMBEDDED = false;
window.assistant = {
  update(state, level) {
    if (state) setState(state);
    if (typeof level === "number") levelTarget = Math.max(levelTarget, level);
  },
};
let connected = EMBEDDED;
function connect() {
  const ws = new WebSocket("ws://localhost:8765");
  ws.onopen = () => { connected = true; setState("idle"); };
  ws.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      if (m.state) setState(m.state);
      if (typeof m.level === "number") levelTarget = Math.max(levelTarget, m.level);
    } catch (_) {}
  };
  ws.onclose = () => {
    connected = false;
    document.getElementById("label").textContent = "Waiting for assistant";
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}
if (EMBEDDED) {
  setState("idle");
  document.getElementById("hint").style.display = "none";
} else {
  connect(); // standalone browser preview only
}

// Preview without the assistant running: press 1-4, and the orb fakes a voice level.
addEventListener("keydown", (e) => {
  const names = { "1": "idle", "2": "listening", "3": "thinking", "4": "speaking" };
  if (names[e.key]) setState(names[e.key]);
});
setInterval(() => {
  if (!connected && (target === STATES.listening || target === STATES.speaking)) levelTarget = Math.random() * 0.8;
}, 90);
</script>
</body>
</html>
